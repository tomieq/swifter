name: Test Linux Platform
on: [push]

jobs:
  Test-Linux-Swift-59:
    runs-on: ubuntu-latest
    container:
      image: swift:5.9
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - uses: actions/checkout@v2
      - name: Run Unit Tests
        run: |
          set -e
          swift build --build-tests
          testbin=$(find .build -name "SwifterPackageTests.xctest" -type f | head -n 1)
          "$testbin" -l | awk '/^SwifterTests[.]/ { print $1 }' > /tmp/swifter-tests.txt
          while IFS= read -r testName; do
            echo "Running $testName"
            timeout 60s "$testbin" "$testName"
          done < /tmp/swifter-tests.txt
